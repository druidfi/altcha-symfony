name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Symfony 7 — supported on PHP 8.2, 8.3, 8.4
          - php: '8.2'
            symfony: '^7.4'
          - php: '8.3'
            symfony: '^7.4'
          - php: '8.4'
            symfony: '^7.4'
          # Symfony 8 requires PHP 8.4+
          - php: '8.4'
            symfony: '^8.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Pin Symfony ${{ matrix.symfony }}
        run: |
          composer require --no-update \
            "symfony/form:${{ matrix.symfony }}" \
            "symfony/framework-bundle:${{ matrix.symfony }}" \
            "symfony/http-foundation:${{ matrix.symfony }}" \
            "symfony/routing:${{ matrix.symfony }}" \
            "symfony/validator:${{ matrix.symfony }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit
